<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partner Enquiry – Kaaiser Australian Education</title>
  <meta name="description" content="Fill in your details and our team will reach out within 24 hours. Partner with India's most trusted Australian education specialist." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=DM+Sans:wght@400&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="assets/favicon_kaaiser.png">

  <!-- HubSpot Form -->
  <script src="https://js-eu1.hsforms.net/forms/embed/144320716.js" defer></script>

  <!-- MS Clarity -->
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
      c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
      t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
      y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "wjpr7nquym");
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:      #ed1c24;
      --green:    #00833c;
      --green-lt: #e6f3ec;
    }

    html, body { width: 100%; overflow-x: hidden; background: #fff; font-family: 'Roboto', sans-serif; }

    /* ── NAV ──────────────────────────────────────────── */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 52px;
      background: transparent;
      position: absolute;
      top: 0; left: 0; right: 0;
    }
    .nav-logo-kaaiser  { height: 58px; width: auto; mix-blend-mode: multiply; }
    .nav-logo-manifest { height: 46px; width: auto; mix-blend-mode: multiply; }
    .nav-cta {
      display: inline-block;
      background: var(--red);
      color: #fff;
      font-family: 'Roboto', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.06em;
      text-decoration: none;
      padding: 11px 24px;
      border-radius: 2px;
    }
    .nav-cta:hover { background: #c4161c; }

    /* ── HERO ─────────────────────────────────────────── */
    .hero {
      position: relative;
      width: 100%;
      min-height: 280px;
      background: linear-gradient(180deg, var(--green-lt) 0%, #ffffff 60%);
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-top: 90px;
      padding-bottom: 0;
    }

    /* Bottom wave shape */
    .hero-wave {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%;
      line-height: 0;
      pointer-events: none;
    }
    .hero-wave svg { display: block; width: 100%; }

    .hero-text {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 20px 20px 60px;
    }
    .hero-title {
      font-family: 'Roboto', sans-serif;
      font-weight: 900;
      font-size: clamp(32px, 4vw, 54px);
      color: #000;
      margin-bottom: 12px;
    }
    .hero-subtitle {
      font-family: 'Roboto', sans-serif;
      font-weight: 500;
      font-size: clamp(14px, 1.6vw, 20px);
      color: #8d8d8d;
    }

    /* ── FORM CONTAINER ───────────────────────────────── */
    .form-section {
      max-width: 1060px;
      margin: -32px auto 60px;
      padding: 0 20px;
      position: relative;
      z-index: 5;
    }

    .form-card {
      background: rgba(251, 251, 251, 0.95);
      border: 1.2px solid #cac9c9;
      border-radius: 24px;
      box-shadow: 0 5px 5px rgba(0,0,0,0.15);
      padding: 48px 60px 56px;
    }

    /* HubSpot form overrides – make it match the Figma style */
    .form-card .hs-form-frame,
    .form-card .hbspt-form {
      width: 100% !important;
    }

    /* Labels */
    .form-card .hs-form label,
    .form-card .hs-form .hs-field-desc {
      font-family: 'Roboto', sans-serif !important;
      font-size: 14px !important;
      color: #525252 !important;
      font-weight: 400 !important;
      margin-bottom: 6px !important;
    }

    /* Inputs */
    .form-card .hs-form input[type="text"],
    .form-card .hs-form input[type="email"],
    .form-card .hs-form input[type="tel"],
    .form-card .hs-form input[type="number"],
    .form-card .hs-form select,
    .form-card .hs-form textarea {
      width: 100% !important;
      height: 52px !important;
      background: #fff !important;
      border: none !important;
      border-radius: 4px !important;
      box-shadow: 0 3px 11px rgba(0,0,0,0.10) !important;
      font-family: 'Roboto', sans-serif !important;
      font-size: 16px !important;
      color: #000 !important;
      padding: 0 18px !important;
    }

    .form-card .hs-form textarea {
      height: auto !important;
      min-height: 100px !important;
      padding: 14px 18px !important;
    }

    /* Section headers within HubSpot form */
    .form-card .hs-richtext h3,
    .form-card .hs-form-booleancheckbox-display,
    .form-card legend {
      font-family: 'Roboto', sans-serif !important;
      font-weight: 700 !important;
      font-size: 15px !important;
      color: var(--red) !important;
      text-align: center !important;
      margin: 28px 0 16px !important;
      letter-spacing: 0.06em !important;
    }

    /* Submit button */
    .form-card .hs-form input[type="submit"],
    .form-card .hs-form .hs-button {
      width: 100% !important;
      height: 64px !important;
      background: var(--green) !important;
      color: #fff !important;
      font-family: 'Roboto', sans-serif !important;
      font-weight: 700 !important;
      font-size: 16px !important;
      letter-spacing: 0.08em !important;
      border: none !important;
      border-radius: 4px !important;
      cursor: pointer !important;
      box-shadow: 0 5px 32px rgba(0,131,60,0.30) !important;
      transition: background 0.2s !important;
      margin-top: 24px !important;
    }
    .form-card .hs-form input[type="submit"]:hover,
    .form-card .hs-form .hs-button:hover {
      background: #006b30 !important;
    }

    /* Error messages */
    .form-card .hs-form .hs-error-msgs {
      font-family: 'Roboto', sans-serif !important;
      font-size: 12px !important;
      color: var(--red) !important;
    }

    /* ── FOOTER ───────────────────────────────────────── */
    .footer {
      padding: 24px 52px;
      border-top: 1px solid rgba(201, 168, 76, 0.25);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .footer-social {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .footer-social a { display: flex; align-items: center; }
    .footer-social img { width: 32px; height: 32px; }
    .footer-contact {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      color: #5a5a5a;
    }
    .footer-copy {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      color: #5a5a5a;
    }
    /* ── RESPONSIVE ──────────────────────────────────── */
    @media (max-width: 768px) {
      .nav { padding: 12px 20px; }
      .nav-logo-kaaiser { height: 40px; }
      .nav-logo-manifest { height: 32px; }
      .nav-cta { font-size: 11px; padding: 9px 14px; }

      .hero { min-height: 200px; }
      .hero-title { font-size: 32px; }
      .hero-subtitle { font-size: 14px; padding: 0 16px; }
      .hero-text { padding: 14px 16px 50px; }

      .form-section { margin: -24px 16px 40px; padding: 0; }
      .form-card { padding: 28px 20px 36px; border-radius: 16px; }

      .footer { padding: 20px; flex-direction: column; align-items: flex-start; gap: 10px; }
      .footer-social img { width: 28px; height: 28px; }
      .footer-contact,
      .footer-copy { font-size: 11px; }
    }

    @media (max-width: 480px) {
      .nav-logo-manifest { display: none; }
      .hero-title { font-size: 26px; }
      .hero-subtitle { font-size: 13px; }
      .form-section { margin: -20px 12px 32px; }
      .form-card { padding: 24px 16px 28px; }
    }
  </style>
</head>

  <!-- ── FOOTER ────────────────────────────────────────── -->
  <footer class="footer">

      <a href="https://www.linkedin.com/company/kaaiser" target="_blank" rel="noopener">
